name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Only the localization submodule is checked out here. libsession-util drags in protobuf and
      # session-deps, which nothing in these checks compiles. `urls.generated.ts` is therefore
      # verified against the library only where the submodule is present -- see generateUrls.ts.
      - run: git submodule update --init --recursive packages/localization/src/localization-src

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:manifests
      - run: pnpm boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:native
      - run: pnpm knip
      - run: pnpm dedupe --check
      - run: pnpm codegen:check

      # A cache hit must never rewrite a committed file. When one does, the checks above have run
      # against something other than the commit being tested -- turbo restored a stale output over
      # a file the PR changed -- and CI passed or failed for a reason that is not in the PR. Last, so
      # it sees what every step before it left behind. See "The build graph" in ARCHITECTURE.md.
      - name: The run left every committed file as it was
        run: |
          if ! git diff --exit-code --stat; then
            git diff
            echo "::error::The run changed committed files, most likely because a cached task restored an output that is stale for this commit -- its turbo hash does not cover something the output depends on. Fix that task's inputs in turbo.json; clearing the Actions cache only hides it until the next time."
            exit 1
          fi
