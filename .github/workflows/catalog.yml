name: catalog

# A build on main is the reference Argos compares a pull request's build with.
on:
  push:
    branches: [main]
  pull_request:
  # The nightly tier. GitHub runs a schedule from the default branch only.
  schedule:
    - cron: '0 17 * * *' # 03:00 Sydney (AEST), 04:00 (AEDT)
  workflow_dispatch:
    inputs:
      tier:
        description: pr draws two themes, plus every accent where a story draws one; nightly every theme and accent
        type: choice
        options: [pr, nightly]
        default: pr

# Only a pull request's runs cancel each other: a cancelled run on main leaves its commit with no
# reference, and Argos falls back to an older one. A shared group would still cancel a waiting
# run, whatever cancel-in-progress says, so each run on main, scheduled or pushed, gets its own.
concurrency:
  group: catalog-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    # Forks stay off this host, where docker is root. A pull request runs its own copy of this file,
    # so the repository setting that refuses fork workflows is what holds; keep both if made public.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # The pinned capture image makes the pictures the same on any runner; this one is faster.
    runs-on: [self-hosted, linux, x64, session-catalog]
    env:
      CATALOG_TIER: ${{ inputs.tier || (github.event_name == 'schedule' && 'nightly') || 'pr' }}
      CATALOG_OUT: ${{ github.workspace }}/test-results/catalog
      # A stacked pull request compares with the build of the one below it, which Argos otherwise
      # passes over until it is approved. Read by the upload and by argos-base.sh.
      ARGOS_REFERENCE_COMMIT: ${{ github.event_name == 'pull_request' && github.base_ref != github.event.repository.default_branch && github.event.pull_request.base.sha || '' }}
      ARGOS_API_BASE_URL: ${{ vars.ARGOS_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      # Only the localization submodule is built here. libsession-util drags in protobuf and
      # session-deps, and nothing in these checks compiles C++.
      - run: git submodule update --init --recursive packages/localization/src/localization-src

      - uses: pnpm/action-setup@v6

      # No pnpm cache: the install below keeps its store on the runner.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      # The default store is under PNPM_HOME, which pnpm/action-setup reinstalls every job; the tool
      # cache outlasts the job, and each runner has its own. A flag, because pnpm 10 and 11 read the
      # store from environment variables of different prefixes.
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - run: pnpm --filter @session/localization build
      - run: pnpm --filter @session/desktop build
      # The fake draws the thirty dev photographs and refuses to start without them. Cached, so the
      # CDN is only asked when the table of photographs changes. Saved straight after the fetch:
      # actions/cache's own post step saves only when the whole job is green.
      - id: dev-media
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/session-app/dev-media
          key: dev-media-${{ hashFiles('packages/client/scripts/fetchFakeMedia.ts') }}
      - run: pnpm fake-media:fetch
      - if: steps.dev-media.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/session-app/dev-media
          key: ${{ steps.dev-media.outputs.cache-primary-key }}

      # In the pinned image: see tests/e2e/catalog/Dockerfile.
      - run: pnpm --filter @session/e2e test:catalog

      # Argos compares with the build of main's head or of the pull request below, which another
      # runner can still be capturing.
      - if: github.event_name == 'pull_request' && (success() || failure())
        run: tests/e2e/catalog/argos-base.sh await
        env:
          GH_TOKEN: ${{ github.token }}

      # The captures go up even when the audit fails: the two are read separately.
      # A tier is its own build name, so a nightly build is never compared with a pr one. Skipped
      # where the token is not given: a fork's pull request, or a repository with no Argos yet.
      - if: success() || failure()
        run: |
          if [ -z "$ARGOS_TOKEN" ]; then echo "No ARGOS_TOKEN: captures not uploaded"; exit 0; fi
          set -o pipefail
          pnpm --filter @session/e2e catalog:upload --build-name "catalog-$CATALOG_TIER" "$CATALOG_OUT" 2>&1 |
            tee "$RUNNER_TEMP/argos-upload.log"
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          # Node gives each address family 250ms to connect; a burst of uploads to a server
          # 250ms away times out on every one, so allow longer.
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000

      - if: github.event_name == 'pull_request' && (success() || failure())
        run: tests/e2e/catalog/argos-base.sh check
        env:
          GH_TOKEN: ${{ github.token }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          UPLOAD_LOG: ${{ runner.temp }}/argos-upload.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
