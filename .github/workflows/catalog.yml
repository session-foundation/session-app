name: catalog

# A build on main is the reference Argos compares a pull request's build with.
on:
  push:
    branches: [main]
  pull_request:
  # The nightly tier. GitHub runs a schedule from the default branch only.
  schedule:
    - cron: '0 17 * * *' # 03:00 Sydney (AEST), 04:00 (AEDT)
  workflow_dispatch:
    inputs:
      tier:
        description: pr draws two themes, plus every accent where a story draws one; nightly every theme and accent
        type: choice
        options: [pr, nightly]
        default: pr

# Only a pull request's runs cancel each other: a cancelled run on main leaves its commit with no
# reference, and Argos falls back to an older one. A shared group would still cancel a waiting
# run, whatever cancel-in-progress says, so each run on main, scheduled or pushed, gets its own.
concurrency:
  group: catalog-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    # GitHub-hosted, so a fork's pull request can run it: no secret reaches a fork, and its captures
    # are not uploaded. The pinned image makes the pictures the same whichever CPU the runner has.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      CATALOG_TIER: ${{ inputs.tier || (github.event_name == 'schedule' && 'nightly') || 'pr' }}
      CATALOG_OUT: ${{ github.workspace }}/test-results/catalog
      ARGOS_API_BASE_URL: ${{ vars.ARGOS_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      # Published by catalog-image.yml. Behind the install and builds; "Wait for the capture image"
      # joins it. Every descriptor is redirected, or the step waits for the fetch to close its output.
      - name: Fetch the capture image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/session-catalog-capture:${{ hashFiles('tests/e2e/catalog/image/**') }}
        run: |
          echo "CATALOG_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          nohup sh -c 'tests/e2e/catalog/fetch-image.sh; echo $? > "$RUNNER_TEMP/image-status"' \
            > "$RUNNER_TEMP/image.log" 2>&1 < /dev/null &

      # Only the localization submodule is built here. libsession-util drags in protobuf and
      # session-deps, and nothing in these checks compiles C++.
      - run: git submodule update --init --recursive packages/localization/src/localization-src

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A stacked pull request compares with the build of the one below it, which Argos otherwise
      # passes over until it is approved: sets ARGOS_REFERENCE_COMMIT, read by the upload and by
      # argos-base.sh, with ARGOS_BELOW_HEAD and ARGOS_BELOW_REF. First, while the merge commit
      # it reads is the one checked out.
      - if: github.event_name == 'pull_request'
        run: tests/e2e/catalog/argos-base.sh reference >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @session/localization build
      - run: pnpm --filter @session/desktop build
      # The fake draws the thirty dev photographs and refuses to start without them. Cached, so the
      # CDN is only asked when the table of photographs changes. Saved straight after the fetch:
      # actions/cache's own post step saves only when the whole job is green.
      - id: dev-media
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/session-app/dev-media
          key: dev-media-${{ hashFiles('packages/client/scripts/fetchFakeMedia.ts') }}
      - run: pnpm fake-media:fetch
      - if: steps.dev-media.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/session-app/dev-media
          key: ${{ steps.dev-media.outputs.cache-primary-key }}

      - name: Wait for the capture image
        timeout-minutes: 10
        run: |
          until [ -e "$RUNNER_TEMP/image-status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/image.log"
          if [ "$(cat "$RUNNER_TEMP/image-status")" != 0 ]; then
            echo "::error::The capture image could not be fetched; its log is above"
            exit 1
          fi

      # In the pinned image: see tests/e2e/catalog/image/Dockerfile.
      - id: capture
        run: pnpm --filter @session/e2e test:catalog

      # A capture that stopped part way still goes up, but one that wrote no screenshot would
      # upload an empty build, which Argos reads as every page removed.
      - id: captured
        if: (success() || failure()) && steps.capture.outcome != 'skipped'
        run: |
          if compgen -G "$CATALOG_OUT/*.png" >/dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The capture wrote no screenshot to $CATALOG_OUT, so nothing goes to Argos"
            exit 1
          fi

      # Argos compares with the build of main's head or of the pull request below, which another
      # runner can still be capturing.
      - if: github.event_name == 'pull_request' && (success() || failure()) && steps.captured.outputs.any == 'true'
        run: tests/e2e/catalog/argos-base.sh await
        env:
          GH_TOKEN: ${{ github.token }}

      # The captures go up even when the audit fails: the two are read separately.
      # A tier is its own build name, so a nightly build is never compared with a pr one. Skipped
      # where the token is not given: a fork's pull request, or a repository with no Argos yet.
      - if: (success() || failure()) && steps.captured.outputs.any == 'true'
        run: |
          if [ -z "$ARGOS_TOKEN" ]; then echo "No ARGOS_TOKEN: captures not uploaded"; exit 0; fi
          set -o pipefail
          pnpm --filter @session/e2e catalog:upload --build-name "catalog-$CATALOG_TIER" "$CATALOG_OUT" 2>&1 |
            tee "$RUNNER_TEMP/argos-upload.log"
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          # Node gives each address family 250ms to connect; a burst of uploads to a server
          # 250ms away times out on every one, so allow longer.
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000

      - if: github.event_name == 'pull_request' && (success() || failure()) && steps.captured.outputs.any == 'true'
        run: tests/e2e/catalog/argos-base.sh check
        env:
          GH_TOKEN: ${{ github.token }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          UPLOAD_LOG: ${{ runner.temp }}/argos-upload.log

      # Only the capture writes traces; a failed upload or baseline check has none to explain it.
      - uses: actions/upload-artifact@v7
        if: failure() && steps.capture.outcome == 'failure'
        with:
          name: playwright-traces
          path: test-results/

  # The nightly tier only: a pull request's or main's run fails where its author sees it, and a
  # dispatched one has someone watching it.
  notify:
    needs: desktop
    if: always() && github.event_name == 'schedule' && needs.desktop.result != 'success'
    uses: ./.github/workflows/alert-discord.yml
    with:
      name: catalog nightly
      result: ${{ needs.desktop.result }}
    secrets:
      webhook: ${{ secrets.ALERT_DISCORD_WEBHOOK_URL }}
