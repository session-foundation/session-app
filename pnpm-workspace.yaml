packages:
  - apps/*
  - packages/*
  - tooling/*
  - tests/*
  # The mobile benchmark is an Expo app nested inside tests/bench, so `tests/*` does not reach it.
  # Without this its package.json is fiction: the dependencies are never installed and it works only
  # because the hoisted layout happens to carry what it needs.
  - tests/bench/mobile

